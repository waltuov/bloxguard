[workspace]
members = ["crates/bloxguard-core", "crates/bloxguard"]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["waltu <182410443+waltuov@users.noreply.github.com>"]
repository = "https://github.com/waltuov/bloxguard"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
full_moon = { version = "=3.0.0", features = ["luau"] }
rbx_binary = "=3.0.1"
rbx_xml = "=3.0.1"
rbx_dom_weak = "=4.2.0"
rbx_types = "=3.1.0"
rbx_reflection_database = "=3.0.1"
clap = { version = "=4.6.7", features = ["derive"] }
toml = "0.9"
globset = "0.4"
lz4_flex = "=0.13.1"
zstd = "=0.13.3"
insta = { version = "=1.49.0", features = ["json"] }
tempfile = "3"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync"] }

[profile.release]
lto = "thin"
strip = true

